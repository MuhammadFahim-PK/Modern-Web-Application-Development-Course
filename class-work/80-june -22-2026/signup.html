<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
    
</head>
<body>
    <main>
        <div class="form-box">
            <h1>Signup</h1>
            <form action="" method="POST" onsubmit="signUp(event)">
  
                <fieldset>
                    <legend>Account Information</legend>
                    <div class="form-group">
                        <label for="userName">User Name</label>
                        <div class="form-field">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter User Name" required autofocus tabindex="1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="userName">Email Address:</label>
                        <div class="form-field">
                            <input type="email" class="form-control" id="email" name="email" placeholder="Enter Email Address" tabindex="2" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <div class="form-field">
                            <input type="password" id="password" name="password" placeholder="Enter 8 Digit Password" tabindex="3" maxlength="8" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="cpassword">Confim Password:</label>
                        <div class="form-field">
                            <input type="password" id="cpassword" name="cpassword" placeholder="Enter 8 Digit Password" tabindex="4" maxlength="8" required>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Personal Details</legend>
                    <div class="form-group">
                        <label for="fname">First Name:</label>
                        <div class="form-field">
                            <input type="text" id="fname" name="fname" placeholder="Enter Your First Name" tabindex="5" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lname">Last Name:</label>
                        <div class="form-field">
                            <input type="text" id="lname" name="lname" placeholder="Enter Your Last Name" tabindex="6" required>
                        </div>
                    </div>                    
                </fieldset>

                <fieldset>
                    <legend>Preferences</legend>
                    <div class="form-group">
                        <div class="form-field w-100">
                            <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                            <label for="newsletter">Sign me up for the weekly newsletter</label>
                        </div>
                    </div>
                </fieldset>
                <!-- <button onclick="signUp()" type="submit">Sign Up</button> -->
                 <button type="submit">Sign Up</button>
            </form>
        </div>
    </main>
    <script src="assets/js/script.js"></script>
</body>
</html>
