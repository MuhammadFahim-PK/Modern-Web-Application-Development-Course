<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main>
        <!-- Seprate Button -->
        <div class="seprate-btn">
            <div class="img-wrapper">
                <img src="./assets/images/bulb-off.png" alt="bulb" class="js_bulb-img">
            </div>
            <div class="btn-wrapper">
                <button onclick="bulpOn();">On</button>
                <button onclick="bulbOff();">Off</button>
            </div>
        </div>
        <!-- /Seprate Button -->

        <!-- One Button -->
         <div class="single-img">
            <div class="img-wrapper">
                <img src="./assets/images/bulb-off.png" alt="bulb" class="js_bulb-img-two">
            </div>
            <div class="btn-wrapper">
                <button onclick="bulpToggleState();">
                    <span>On</span>
                </button>
            </div>
        </div>
        <!-- /One Button -->


    </main>
    <script src="assets/js/script.js"></script>
</body>
</html>
